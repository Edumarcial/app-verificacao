<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Processo Seletivo - Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="intro-screen" class="intro-screen">
        <div class="intro-content">
            <h2 class="glitch" data-text="INITIALIZING SYSTEM...">INITIALIZING SYSTEM...</h2>
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <p class="intro-status">Carregando módulos de segurança...</p>
        </div>
    </div>

    <main class="container hidden" id="main-container">
        <h1>VERIFICAÇÃO DE ELEGIBILIDADE</h1>
        <form id="vacancy-form">
            <div class="form-group">
                <label for="name">NOME COMPLETO</label>
                <input type="text" id="name" required autocomplete="off" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="age">IDADE</label>
                <input type="number" id="age" min="0" max="120" required placeholder="Ex: 25">
            </div>

            <div class="form-group">
                <label for="height">ALTURA (M)</label>
                <input type="number" id="height" step="0.01" min="0" max="3.00" required placeholder="Ex: 1.75">
            </div>

            <button type="submit">ANALISAR PERFIL</button>
        </form>
    </main>

    <div id="popup-overlay" class="popup-overlay hidden">
        <div class="popup-card" id="popup-card">
            <div class="popup-header">
                <span class="popup-title">STATUS DO SISTEMA</span>
                <button id="popup-close" class="popup-close">&times;</button>
            </div>
            <div class="popup-body">
                <p id="popup-message"></p>
            </div>
            <div class="popup-footer">
                <button id="popup-action" class="popup-btn">FECHAR</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
